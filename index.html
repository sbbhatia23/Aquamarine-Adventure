<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquamarine Adventure</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;

      /* Image background */
      background-image: url("assets/submarine background.webp");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
      z-index: 0;
    }

    .container {
      position: relative;
      text-align: center;
      animation: fadeIn 1.5s ease;
      z-index: 1;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0px 4px 10px rgba(0,0,0,0.6);
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      opacity: 0.85;
      text-shadow: 0px 3px 8px rgba(0,0,0,0.6);
    }

    button {
      background-color: rgba(255,255,255,0.1);
      border: 2px solid white;
      padding: 14px 40px;
      font-size: 1.5rem;
      cursor: pointer;
      color: white;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
      backdrop-filter: blur(4px);
    }

    button:hover {
      background-color: rgba(255,255,255,0.8);
      color: #001f3f;
      box-shadow: 0 0 30px rgba(0,255,255,0.7);
      transform: scale(1.08);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="container">
    <h1>🌊 Welcome to Aquamarine Adventure 🌊</h1>
    <p>Click below to start your underwater journey!</p>
    <button id="start-btn">Dive In</button>
  </div>

  <script>
    document.getElementById("start-btn").addEventListener("click", () => {
      window.location.href = "main page.html";
    });
  </script>
</body>
</html>
