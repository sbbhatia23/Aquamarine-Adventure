<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquamarine Adventure</title>
  <link rel="stylesheet" href="style.css">
   
</head>
<body>
  <div class="video-container">
    <!-- Cover image -->
    <img id="cover-image" src="assets/firstlevel.png" alt="Cover">

    <!-- Video -->
    <video id="intro-video" src="assets/cover.mp4"></video>

    <!-- Music -->
    <audio id="bg-music" src="assets/bg.wav" loop></audio>

    <!-- Controls -->
    <div class="controls">
      <!-- Play / Pause -->
      <img id="play-btn" class="control-button" src="assets/icons/play.png" alt="Play">
      <img id="pause-btn" class="control-button" src="assets/icons/pause.png" alt="Pause">

      <!-- Music volume -->
      <label style="font-size: 14px;">🎵 volume</label>
      <input id="music-volume" class="slider" type="range" min="0" max="1" step="0.01" value="0.5">

      <!-- Video speed -->
      <label style="font-size: 14px;"> intro speed</label>
      <input id="speed-slider" class="slider" type="range" min="0.25" max="2" step="0.25" value="1">
    </div>

    <!-- Dive In button -->
    <img id="dive-btn" src="assets/icons/dive.png" alt="Dive In">
  </div>
  <script>
    
    // Elements
    const playBtn = document.getElementById('play-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const introVideo = document.getElementById('intro-video');
    const coverImage = document.getElementById('cover-image');
    const diveBtn = document.getElementById('dive-btn');
    const bgMusic = document.getElementById('bg-music');
    const musicVolume = document.getElementById('music-volume');
    const speedSlider = document.getElementById('speed-slider');

    // Play/Pause
    playBtn.addEventListener('click', () => {
      coverImage.style.display = 'none';
      introVideo.style.display = 'block';
      introVideo.play();
      bgMusic.play();
    });
    pauseBtn.addEventListener('click', () => {
      introVideo.pause();
      bgMusic.pause();
    });

    // Volume & Speed
    musicVolume.addEventListener('input', () => bgMusic.volume = musicVolume.value);
    speedSlider.addEventListener('input', () => introVideo.playbackRate = speedSlider.value);

    // Show dive button after video ends
    introVideo.addEventListener('ended', () => diveBtn.style.display = 'block');

    // Go to game
    diveBtn.addEventListener('click', () => window.location.href = "game.html");
  </script>
</body>
</html>
