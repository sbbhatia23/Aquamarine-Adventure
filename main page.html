<html>
    <head>
      
        <!-- add the line below -->
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"></script>
      <style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden; /* Prevent scrollbars */
    background: black; /* Fallback background */
  }

  #sketch-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Push sketch behind the content */
  }

  main {
    position: relative;
    z-index: 1; /* Keep your portfolio text above the sketch */
    padding: 20px;
    color: white;
    max-width: 700px;
  }
</style>
<style>
  /* Overlay and button styling */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.6); /* Black with 60% opacity */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999; /* Keep it on top of everything */
  transition: opacity 0.8s ease; /* Fade-out transition */
}

#level-info {
  text-align: center;
  color: white;
}

#level-title {
  font-size: 3rem;
  margin-bottom: 20px;
}

  /* Fullscreen button style */
  #enter-btn {
    font-size: 2rem;
    padding: 20px 50px;
    background-color: transparent;
    border: 2px solid white;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 2px;
  }

  #enter-btn:hover {
    background-color: white;
    color: black;
    transform: scale(1.05);
  }

  /* Hide class triggers fade-out */
  #overlay.hide {
    opacity: 0;
    pointer-events: none;
  }
</style>



    </head>
    <body>
     <!-- Overlay for starting levels -->
<div id="overlay">
  <div id="level-info">
    <h1 id="level-title">Level 1</h1>
    <button id="enter-btn">Start</button>
  </div>
</div>

    <button id="enter-btn">Level 1</button>
</div>

        <main>
          <label>Text Size:
  <input id="text-size" type="range" min="50" max="300" value="150" />
  <span id="textSizeVal">150</span>
</label>
              <!-- Your p5.js sketch will appear here -->
        <div id="sketch-container"></div>
        </main>
        <!-- LEVEL OVERLAY -->
<div id="level-overlay" class="hidden">
  <div id="level-box">
    <h1 id="level-text">Level 1</h1>
  </div>
</div>

<style>
  /* Overlay styling */
  #level-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }

  /* Visible overlay */
  #level-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* Level box */
  #level-box {
    background: rgba(0, 0, 50, 0.7);
    padding: 30px 60px;
    border-radius: 20px;
    border: 2px solid white;
    text-align: center;
    box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.4);
  }

  #level-text {
    font-size: 4rem;
    color: white;
    margin: 0;
    font-family: Arial, sans-serif;
    letter-spacing: 3px;
  }
</style>

        <script src="submarine.js"></script>

        <!-- add the line below -->
        <script src="landingpage.js"></script>
  
        <footer>
            <p>©2025 Sarita Bhatia </p>
        </footer>
       <script>
  document.getElementById("enter-btn").addEventListener("click", function() {
    const overlay = document.getElementById("overlay");
    overlay.classList.add("hide"); // Add the fade-out class
    setTimeout(() => overlay.style.display = "none", 800); // Remove from layout after fade
  });
</script>


    </body>
</html>
